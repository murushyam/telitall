<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>TeliTall</title>
  <style>
    :root {
      --paper: #f4f7f5;
      --card: #ffffff;
      --ink: #0b2340;
      --muted: #5c6d7e;
      --line: #d5e2db;
      --green: #0e9f6e;
      --blue: #1b5fd1;
      --mint: #e7f4ee;
      --on-green: #f4fff9;
      --on-ink: #f4faf7;
      --danger: #d93838;
      --shadow: 0 1px 2px rgb(11 35 64 / 0.04);
      font-family: "Outfit", "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--paper); }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: default; }
    #app { height: 100dvh; display: flex; flex-direction: column; max-width: 36rem; margin: 0 auto; background: var(--paper); }
    header { height: 3.5rem; display: flex; align-items: center; justify-content: space-between; padding: 0 1rem; background: var(--card); border-bottom: 1px solid var(--line); flex: none; }
    .brand-wrap { display: flex; align-items: center; gap: 0.5rem; }
    main { flex: 1; overflow-y: auto; padding: 1.25rem 1rem 1.5rem; }
    nav { display: flex; background: var(--card); border-top: 1px solid var(--line); flex: none; padding-bottom: env(safe-area-inset-bottom); }
    nav button { flex: 1; min-height: 3.5rem; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.15rem; font-size: 0.75rem; font-weight: 500; color: var(--muted); }
    nav button[aria-current="page"] { color: var(--green); }
    h1 { font-size: 1.5rem; line-height: 1.25; font-weight: 600; margin: 0; letter-spacing: -0.02em; }
    h2 { font-size: 1.125rem; line-height: 1.35; font-weight: 600; margin: 0.5rem 0 0; }
    p { margin: 0; }
    .muted { color: var(--muted); }
    .green { color: var(--green); }
    .blue { color: var(--blue); }
    .lead { margin-top: 0.5rem; font-size: 0.875rem; color: var(--muted); }
    .stack { display: grid; gap: 0.75rem; }
    .stack-lg { display: grid; gap: 1.25rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 1.5rem; padding: 1rem; box-shadow: var(--shadow); text-align: left; }
    .card.mint { background: var(--mint); }
    a.card, button.card { display: block; width: 100%; text-decoration: none; }
    .search { height: 3rem; width: 100%; border-radius: 999px; border: 1px solid var(--line); background: var(--card); padding: 0 1rem; outline: none; }
    .search:focus { border-color: var(--green); }
    .chips { display: flex; gap: 0.5rem; overflow-x: auto; margin: 0 -1rem; padding: 0 1rem; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { height: 2.5rem; flex: none; border-radius: 999px; padding: 0 1rem; border: 1px solid var(--line); background: var(--card); font-size: 0.875rem; font-weight: 500; }
    .chip.on { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
    .primary, .secondary, .danger-btn { height: 2.75rem; border-radius: 999px; padding: 0 1rem; font-size: 0.875rem; font-weight: 600; border: 0; }
    .primary { background: var(--green); color: var(--on-green); }
    .secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    .danger-btn { background: #fde8e8; color: var(--danger); border: 1px solid #f8b4b4; }
    .full { width: 100%; }
    label { display: grid; gap: 0.35rem; font-size: 0.875rem; font-weight: 500; }
    input[type="text"], input[type="email"], input[type="password"], textarea, select { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 1rem; padding: 0.75rem 0.9rem; outline: none; }
    textarea { min-height: 8rem; resize: vertical; }
    input:focus, textarea:focus, select:focus { border-color: var(--green); }
    .switch { display: grid; grid-template-columns: 1fr 1fr; gap: 0.25rem; background: var(--mint); padding: 0.25rem; border-radius: 999px; }
    .switch button { height: 2.75rem; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font-weight: 600; font-size: 0.875rem; }
    .switch button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
    .error { color: var(--danger); font-size: 0.875rem; font-weight: 500; }
    .meta { margin-top: 0.75rem; font-size: 0.875rem; color: var(--muted); }
    .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .boot { min-height: 100dvh; display: grid; place-items: center; text-align: center; gap: 0.75rem; }
    .boot p { letter-spacing: 0.04em; font-weight: 500; }
    .word { font-weight: 700; letter-spacing: -0.03em; font-size: 1.15em; }
    .row-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
    .pill { height: 2.25rem; border-radius: 999px; padding: 0 0.8rem; border: 1px solid var(--line); background: var(--card); font-size: 0.8125rem; font-weight: 600; }
    .pill.on { background: var(--mint); border-color: transparent; color: var(--green); }
    .pill.danger { color: var(--danger); }
    .best { font-size: 0.75rem; font-weight: 700; color: var(--green); letter-spacing: 0.04em; text-transform: uppercase; }
    .bubble { border-radius: 1.25rem; padding: 0.8rem 0.9rem; font-size: 0.9375rem; line-height: 1.45; }
    .bubble.user { background: var(--ink); color: var(--on-ink); margin-left: 2rem; }
    .bubble.assistant, .bubble.peer { background: var(--card); border: 1px solid var(--line); margin-right: 1rem; }
    .bubble.system { background: var(--mint); border: 1px solid var(--line); text-align: center; font-size: 0.8125rem; color: var(--ink); margin: 0.25rem 0; }
    .who { font-size: 0.75rem; font-weight: 600; margin-bottom: 0.25rem; color: var(--muted); }
    .composer { display: grid; gap: 0.5rem; }
    .stat { font-size: 1.875rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .linkish { background: none; border: 0; padding: 0; color: var(--green); font-weight: 600; font-size: 0.875rem; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(11, 35, 64, 0.4); display: flex; align-items: flex-end; justify-content: center; z-index: 100; padding: 1rem; }
    .modal-sheet { background: var(--card); width: 100%; max-width: 34rem; border-radius: 1.5rem; padding: 1.25rem; box-shadow: 0 10px 25px rgba(0,0,0,0.15); display: grid; gap: 1rem; }
    .edited-tag { font-style: italic; color: var(--muted); }
    .timer-badge { font-weight: 700; font-size: 0.8125rem; background: #fff3cd; color: #856404; padding: 0.25rem 0.6rem; border-radius: 999px; border: 1px solid #ffeeba; }
    .badge-expert { font-size: 0.75rem; font-weight: 700; background: #e6f6ee; color: #0e9f6e; padding: 0.15rem 0.5rem; border-radius: 999px; border: 1px solid #b7ebd3; display: inline-flex; align-items: center; gap: 0.25rem; }
    .badge-intent { font-size: 0.75rem; font-weight: 600; background: #edf4ff; color: #1b5fd1; padding: 0.15rem 0.5rem; border-radius: 999px; border: 1px solid #c9defe; display: inline-flex; align-items: center; }
    .role-btn { border-radius: 1rem; border: 1px solid var(--line); padding: 0.85rem; text-align: left; background: var(--card); }
    .role-btn.active { border-color: var(--green); background: var(--mint); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const CATS = [
      ["relationships", "Relationships"],
      ["life", "Life"],
      ["career", "Career"],
      ["education", "Education"],
      ["mathematics", "Mathematics"],
      ["technology", "Technology"],
      ["business", "Business"],
      ["health", "Health"],
      ["home", "Home"],
      ["other", "Other"]
    ];
    const CAT_LABEL = Object.fromEntries(CATS);
    const KEY = "telitall.phone.v2";
    const CRISIS = /\b(suicid|kill myself|killing myself|self[-\s]?harm|end my life|want to die|do not want to live|don't want to live)\b/i;
    const CRISIS_REPLY = "I'm glad you said this out loud. I'm not the right help for it, and you deserve a person right now. If you might hurt yourself, contact local emergency services. In India you can call iCall at 9152987821 or AASRA at 9820466726. If you can, tell someone who is near you.";

    const SAMPLE_EXPERIENCES = [
      "First heartbreak & feeling stuck",
      "Preparing for job interview with no experience",
      "Moved to a new city alone",
      "Exam burnout & mind wandering",
      "Handling family pressure on career",
      "Feeling lonely in a crowded place"
    ];

    function esc(value) {
      return String(value || "").replace(/[&<>"']/g, (ch) => "&#" + ch.charCodeAt(0) + ";");
    }
    function hoursAgo(hours) { return new Date(Date.now() - hours * 3600 * 1000).toISOString(); }
    function repLabel(points) {
      if (points >= 60) return "Guide";
      if (points >= 30) return "Trusted";
      if (points >= 10) return "Helper";
      return "New voice";
    }
    function formatWhen(iso, editedAt) {
      const t = Date.parse(iso);
      let str = "";
      if (Number.isFinite(t)) {
        const seconds = Math.max(0, Date.now() - t) / 1000;
        if (seconds < 60) str = "just now";
        else if (seconds < 3600) str = Math.floor(seconds / 60) + "m ago";
        else if (seconds < 86400) str = Math.floor(seconds / 3600) + "h ago";
        else if (seconds < 86400 * 7) str = Math.floor(seconds / 86400) + "d ago";
        else str = new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
      }
      if (editedAt) str += ' <span class="edited-tag">(edited)</span>';
      return str;
    }
    function formatCountdown(expiresAtIso) {
      const t = Date.parse(expiresAtIso);
      const remaining = Math.max(0, Math.floor((t - Date.now()) / 1000));
      const mins = Math.floor(remaining / 60);
      const secs = remaining % 60;
      return (mins < 10 ? "0" : "") + mins + ":" + (secs < 10 ? "0" : "") + secs;
    }
    function kindLabel(kind) { return kind === "knowledge" ? "Knowledge" : "Experience"; }

    function seed() {
      return {
        nextId: 100,
        currentUser: null, // { id: "me", name: "Guest", email: "", role: "user", specialty: "", intent: "both" }
        accounts: [],
        reputation: 0,
        reps: {
          "seed:nila": 1, "seed:arun": 1, "seed:divya": 1, "seed:sam": 1, "seed:leila": 1, "seed:jonah": 1,
          "seed:ama": 31, "seed:kofi": 20, "seed:meera": 22, "seed:luis": 18, "seed:priya": 16, "seed:hana": 28
        },
        votes: [],
        reports: [],
        connectRooms: [],
        questions: [
          { id: 1, userId: "seed:nila", authorName: "Nila", authorRole: "user", title: "What did your first heartbreak actually feel like?", body: "I do not want the poster version. I want the real one. What did the first weeks feel like, and what actually helped you get through them?", category: "relationships", kind: "experience", createdAt: hoursAgo(2) },
          { id: 2, userId: "seed:arun", authorName: "Arun", authorRole: "user", title: "How do I prepare for a job interview with almost no experience?", body: "I have one campus project and a part-time shop job. I freeze when they ask me to walk us through your experience. What did you actually say when you had almost nothing on paper?", category: "career", kind: "experience", createdAt: hoursAgo(24) },
          { id: 3, userId: "seed:divya", authorName: "Divya", authorRole: "user", title: "What surprised you about moving to a new city alone?", body: "I am about to move with two bags and nobody waiting at the station. I want the unpretty version of the first month, not a travel list.", category: "life", kind: "experience", createdAt: hoursAgo(48) },
          { id: 4, userId: "seed:sam", authorName: "Sam", authorRole: "expert", authorSpecialty: "Study Psychology", title: "How do you study when your mind keeps wandering?", body: "I sit down for three hours and remember none of it. What actually works when the task feels too big to start?", category: "education", kind: "knowledge", createdAt: hoursAgo(72) },
          { id: 5, userId: "seed:leila", authorName: "Leila", authorRole: "user", title: "What helped you sleep again after a stressful season?", body: "After exams I was exhausted and wide awake. I am not looking for a medical plan. I want what your nights were actually like, and what you changed.", category: "health", kind: "experience", createdAt: hoursAgo(96) },
          { id: 6, userId: "seed:jonah", authorName: "Jonah", authorRole: "expert", authorSpecialty: "Mathematics Teacher", title: "Why do we complete the square, in plain language?", body: "I can follow the steps and still not know why anyone would do this. Can someone explain the idea, not just the recipe?", category: "mathematics", kind: "knowledge", createdAt: hoursAgo(144) }
        ],
        answers: [
          { id: 11, questionId: 1, userId: "seed:ama", authorName: "Ama", authorRole: "user", helpful: 24, isBest: true, createdAt: hoursAgo(1.5), body: "The first week I kept checking my phone like it was a door. What helped was not a quote. I told one friend the unpretty version, and I walked at the same time every evening so the day had an edge. It did not feel better. It felt less endless." },
          { id: 12, questionId: 1, userId: "seed:kofi", authorName: "Kofi", authorRole: "user", helpful: 18, isBest: false, createdAt: hoursAgo(1.16), body: "I thought I was handling it until a song started in a shared auto. I got off two stops early and just stood there. The useful part was stopping the attempt to win the story. I wrote what I wished I had said, and I did not send it. After about a month the song was just a song again. Not gone. Quieter." },
          { id: 13, questionId: 2, userId: "seed:meera", authorName: "Meera", authorRole: "expert", authorSpecialty: "HR & Career Mentor", helpful: 15, isBest: true, createdAt: hoursAgo(20), body: "I wrote three stories in this shape: the situation, what I did, what changed. Interviewers do not need a career. They need to see how you think when something is messy. I practiced out loud until I stopped apologizing for being new. The shop job counted. A rude customer and a calm fix is a story." },
          { id: 14, questionId: 3, userId: "seed:luis", authorName: "Luis", authorRole: "user", helpful: 11, isBest: true, createdAt: hoursAgo(36), body: "I moved with two bags and no one at the station. The surprise was how loud loneliness is at 9pm, and how much a tiny routine fixes before new friends do. A tea stall learned my order before anyone learned my name. Start there. One place you go at the same time every day." },
          { id: 15, questionId: 5, userId: "seed:priya", authorName: "Priya", authorRole: "user", helpful: 9, isBest: true, createdAt: hoursAgo(72), body: "This is only what I lived, not medical advice. I was tired and awake at the same time. What changed it was a boring wind-down I kept even when it felt pointless: phone in another room, lights low, a paper book I did not care about. It took about two weeks before my body believed the night was over." },
          { id: 16, questionId: 6, userId: "seed:hana", authorName: "Hana", authorRole: "expert", authorSpecialty: "Math Educator", helpful: 21, isBest: true, createdAt: hoursAgo(120), body: "Completing the square forces a quadratic to look like (something) squared plus a leftover number, because squares are easy to undo with a square root. For x squared + 6x, ask what was doubled to make 6. That is 3. Square it to get 9. Add and subtract 9 so the value does not change. Then (x+3) squared - 9 is sitting in front of you, and you can take the root." }
        ],
        threads: []
      };
    }

    function load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (!raw) return seed();
        const data = JSON.parse(raw);
        if (!data || !Array.isArray(data.questions) || !Array.isArray(data.answers)) return seed();
        data.reports = data.reports || [];
        data.connectRooms = data.connectRooms || [];
        data.accounts = data.accounts || [];
        return data;
      } catch (error) {
        return seed();
      }
    }
    function save() { localStorage.setItem(KEY, JSON.stringify(db)); }

    function purgeExpiredRooms() {
      const now = Date.now();
      if (!db.connectRooms) db.connectRooms = [];
      const init = db.connectRooms.length;
      db.connectRooms = db.connectRooms.filter((r) => Date.parse(r.expiresAt) > now);
      if (db.connectRooms.length !== init) save();
    }

    let db = load();
    purgeExpiredRooms();

    let ui = {
      screen: "boot",
      authMode: "signup", // "signup" | "signin"
      roleForm: "user",   // "user" | "expert"
      intentForm: "both", // "ask" | "answer" | "both"
      specialtyForm: "",
      category: "all",
      homeKind: "all",
      query: "",
      qid: null,
      threadId: null,
      connectRoomId: null,
      connectTopic: "",
      error: "",
      notice: "",
      kind: "experience",
      stack: [],
      confirmDelete: false,
      editingQuestion: false,
      editingAnswerId: null,
      reportModal: null,
      editingRoleModal: false
    };

    function displayName() {
      if (db.currentUser && db.currentUser.name) return db.currentUser.name;
      return "Guest Member";
    }
    function currentRole() {
      if (db.currentUser && db.currentUser.role) return db.currentUser.role;
      return "user";
    }
    function currentSpecialty() {
      return (db.currentUser && db.currentUser.specialty) || "";
    }
    function currentIntent() {
      if (db.currentUser && db.currentUser.intent) return db.currentUser.intent;
      return "both";
    }
    function reputationOf(userId) {
      if (userId === "me") return Number(db.reputation) || 0;
      return Number(db.reps && db.reps[userId]) || 0;
    }
    function bump(userId, delta) {
      if (!userId || String(userId).startsWith("seed:")) return;
      if (userId === "me") db.reputation = Math.max(0, (Number(db.reputation) || 0) + delta);
      else {
        db.reps = db.reps || {};
        db.reps[userId] = Math.max(0, (Number(db.reps[userId]) || 0) + delta);
      }
    }
    function answersFor(id) { return db.answers.filter((answer) => answer.questionId === id); }
    function questionById(id) { return db.questions.find((question) => question.id === id) || null; }

    function logo(size) {
      const s = size || 36;
      return '<svg viewBox="0 0 64 64" width="' + s + '" height="' + s + '" aria-hidden="true"><circle cx="20" cy="16" r="8" fill="#1b5fd1"/><path d="M6 46c1.2-11 8-16 15.5-16 3.2 0 5.8 1 8.2 3.2-4.2 1.6-7.2 5.4-8.2 10.2L6 46Z" fill="#1b5fd1"/><circle cx="46" cy="15" r="8" fill="#0e9f6e"/><path d="M34 48c1.6-10 8.4-16 16.5-16 5.4 0 10 2.6 12.5 7.2-6.6 1.2-12.2 4.6-16.2 9.6L34 48Z" fill="#0e9f6e"/><path d="M40 8.5v6M48.5 11.2l-3.2 4.2M31.5 11.2l3.2 4.2" stroke="#0e9f6e" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M16 30.5h22.5a11 11 0 0 1 11 11v.5a11 11 0 0 1-11 11H27l-8 6.2V52a11 11 0 0 1-8.2-4.2A11 11 0 0 1 16 30.5Z" fill="#0e9f6e"/><circle cx="27" cy="42" r="2.1" fill="#f4fff9"/><circle cx="34" cy="42" r="2.1" fill="#f4fff9"/><circle cx="41" cy="42" r="2.1" fill="#f4fff9"/></svg>';
    }
    function wordmark() {
      return '<span class="word"><span class="blue">TELI</span><span class="green">TALL</span></span>';
    }
    function icon(name, active) {
      const color = active ? "#0e9f6e" : "#5c6d7e";
      if (name === "home") return '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="1.75"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z"/></svg>';
      if (name === "ask") return '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="1.75"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4 11.5-11.5Z"/></svg>';
      if (name === "connect") return '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="1.75"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>';
      if (name === "laya") return '<svg width="24" height="24" viewBox="0 0 24 24"><path d="M5 6.5h10.2A3.8 3.8 0 0 1 19 10.3v.2a3.8 3.8 0 0 1-3.8 3.8H9.2L6 17.2v-2.4A3.8 3.8 0 0 1 5 10.5v-.2A3.8 3.8 0 0 1 5 6.5Z" fill="' + color + '"/><circle cx="9.2" cy="10.4" r="1" fill="#fff"/><circle cx="12.2" cy="10.4" r="1" fill="#fff"/><circle cx="15.2" cy="10.4" r="1" fill="#fff"/></svg>';
      return '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="1.75"><circle cx="12" cy="8" r="3.2"/><path d="M5 19.2c.6-3.4 3-5.2 7-5.2s6.4 1.8 7 5.2"/></svg>';
    }

    function openTab(screen) {
      ui.stack = [];
      ui.screen = screen;
      ui.error = "";
      ui.notice = "";
      ui.qid = null;
      ui.confirmDelete = false;
      ui.editingQuestion = false;
      ui.editingAnswerId = null;
      ui.reportModal = null;
      ui.editingRoleModal = false;
      purgeExpiredRooms();
      render();
    }
    function push(partial) {
      ui.stack.push({ screen: ui.screen, qid: ui.qid, threadId: ui.threadId, connectRoomId: ui.connectRoomId });
      Object.assign(ui, partial, { error: "", notice: "", confirmDelete: false, editingQuestion: false, editingAnswerId: null, reportModal: null });
      render();
    }
    window.telitallBack = function () {
      if (ui.reportModal) { ui.reportModal = null; render(); return "stay"; }
      if (ui.editingRoleModal) { ui.editingRoleModal = false; render(); return "stay"; }
      const prev = ui.stack.pop();
      if (!prev) return "exit";
      ui.screen = prev.screen;
      ui.qid = prev.qid;
      ui.threadId = prev.threadId;
      ui.connectRoomId = prev.connectRoomId;
      ui.error = "";
      ui.notice = "";
      ui.confirmDelete = false;
      ui.editingQuestion = false;
      ui.editingAnswerId = null;
      ui.reportModal = null;
      render();
      return "stay";
    };

    function shell(body) {
      const tab = ui.screen === "q" ? "home" : ui.screen;
      const item = (screen, name, label) =>
        '<button type="button" data-tab="' + screen + '" aria-current="' + (tab === screen ? "page" : "false") + '">' +
        icon(name, tab === screen) + label + "</button>";

        '<div class="stack"><h2>Common Situations</h2>' + sampleChips + '</div>' +

      const tone = question.kind === "experience" ? "green" : "blue";

          '</div></div>';

        const aRoleBadge = answer.authorRole === "expert"

          : '';

            (ui.error ? '<p class="error">' + esc(ui.error) + '</p>' : "") +

            '<button type="button" class="secondary" data-cancel-edit-a="1">Cancel</button>' +

          '<button type="button" class="pill' + (voted ? " on" : "") + '" data-vote="' + answer.id + '"' + (mine || voted ? " disabled" : "") + ">" + (voted ? "Helpful" : "Mark helpful") + " · " + answer.helpful + "</button>" +

        '<div style="display:flex;justify-content:space-between;align-items:center"><p class="muted" style="font-size:.875rem">Signed in as <strong>' + esc(db.currentUser.email || db.currentUser.name) + '</strong></p><button type="button" class="linkish" data-signout="1">Sign Out</button></div>'
        ) +

        '<section class="card"><p class="muted" style="font-size:.875rem">Reputation Points</p><p class="stat">' + (Number(db.reputation) || 0) + '</p><p class="lead">Earn points when asking, answering, or helping peers.</p></section>' +
        '<form id="name-form" class="stack"><label>Name on your posts<input type="text" name="name" maxlength="40" value="' + esc(displayName()) + '" /></label>' +
        (ui.error ? '<p class="error">' + esc(ui.error) + "</p>" : "") +
        (ui.notice ? '<p class="green" style="font-size:.875rem;font-weight:600">' + esc(ui.notice) + "</p>" : "") +
        '<button class="primary" type="submit">Save Name</button></form>' +
        "<section class='stack'><h2>Your questions</h2>" + qList + "</section>" +
        "<section class='stack'><h2>Your answers</h2>" + aList + "</section></div>"
      );
    }

    function renderRoleModal() {
      const isExpert = (ui.roleForm || currentRole()) === "expert";
      const curIntent = ui.intentForm || currentIntent();
      return (
        '<div class="modal-backdrop">' +
        '<form id="update-role-form" class="modal-sheet">' +
        '<h2>Update Your Role & Intent</h2>' +
        '<label style="font-weight:600">Are you a regular member or domain expert?</label>' +
        '<div class="grid-2">' +
        '<button type="button" class="role-btn' + (!isExpert ? " active" : "") + '" data-modal-role="user"><p style="font-weight:600">👤 Member</p><p class="lead" style="font-size:.75rem">Seeker or peer sharing stories</p></button>' +
        '<button type="button" class="role-btn' + (isExpert ? " active" : "") + '" data-modal-role="expert"><p style="font-weight:600">🎓 Expert</p><p class="lead" style="font-size:.75rem">Domain specialist</p></button>' +
        '</div>' +
        (isExpert ? '<label>Specialty Field<input type="text" name="specialty" placeholder="e.g. Psychology, Career Mentor..." value="' + esc(ui.specialtyForm || currentSpecialty()) + '" required /></label>' : '') +
        '<label style="font-weight:600">What is your intent on TeliTall?</label>' +
        '<div class="grid-3">' +
        '<button type="button" class="pill' + (curIntent === "ask" ? " on" : "") + '" data-modal-intent="ask">Ask only</button>' +
        '<button type="button" class="pill' + (curIntent === "answer" ? " on" : "") + '" data-modal-intent="answer">Answer only</button>' +
        '<button type="button" class="pill' + (curIntent === "both" ? " on" : "") + '" data-modal-intent="both">Both</button>' +
        '</div>' +
        '<div class="row-actions">' +
        '<button type="submit" class="primary">Save Role</button>' +
        '<button type="button" class="secondary" data-close-role-modal="1">Cancel</button>' +
        '</div></form></div>'
      );
    }

    function renderReportModal() {
      const m = ui.reportModal;
      if (!m) return "";
      return (
        '<div class="modal-backdrop">' +
        '<form id="report-form" class="modal-sheet">' +
        '<h2>Report ' + esc(m.type) + '</h2>' +
        '<p class="lead">Help keep TeliTall safe and constructive.</p>' +
        '<label>Reason' +
        '<select name="reason">' +
        '<option value="spam">Spam or promotion</option>' +
        '<option value="harassment">Harassment or hate speech</option>' +
        '<option value="harmful">Dangerous or illegal advice</option>' +
        '<option value="off_topic">Off topic</option>' +
        '<option value="other">Other issue</option>' +
        '</select></label>' +
        '<label>Optional detail<textarea name="details" style="min-height:4rem" placeholder="Describe the issue..."></textarea></label>' +
        '<div class="row-actions">' +
        '<button type="submit" class="danger-btn">Submit Report</button>' +
        '<button type="button" class="secondary" data-close-report="1">Cancel</button>' +
        '</div></form></div>'
      );
    }

    function startConnectRoom(topic) {
      purgeExpiredRooms();
      const myNum = Math.floor(100 + Math.random() * 900);
      const peerNum = (myNum + 417) % 900 + 100;
      const room = {
        id: "room_" + Date.now(),
        topic: topic,
        myAlias: "Companion #" + myNum,
        peerAlias: "Companion #" + peerNum,
        createdAt: new Date().toISOString(),
        expiresAt: new Date(Date.now() + 3600 * 1000).toISOString(),
        messages: [
          { sender: "system", content: "🔒 Connected anonymously with Companion #" + peerNum + ". Neither person sees real names, numbers, or details. This chat automatically self-destructs in 1 hour." },
          { sender: "Companion #" + peerNum, content: "Hey... I saw you wanted to talk about " + topic + ". How are you holding up with it today?" }
        ]
      };
      db.connectRooms.push(room);
      save();
      ui.connectRoomId = room.id;
      ui.screen = "connect";
      render();
    }

    function render() {
      const app = document.getElementById("app");
      if (ui.screen === "boot") {
        app.innerHTML = '<div class="boot"><div>' + logo(64) + '<div style="margin-top:.75rem;font-size:1.75rem">' + wordmark() + '</div><p class="muted" style="margin-top:.75rem">Ask · Learn · Share · Grow</p></div></div>';
        return;
      }
      if (ui.screen === "auth") {
        app.innerHTML = authHtml();
        return;
      }
      const html = ui.screen === "connect" ? connectHtml() : ui.screen === "ask" ? askHtml() : ui.screen === "q" ? questionHtml() : ui.screen === "laya" ? layaHtml() : ui.screen === "you" ? youHtml() : homeHtml();
      const focus = document.activeElement && document.activeElement.id;
      app.innerHTML = html;
      if (focus === "search") {
        const input = document.getElementById("search");
        if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
      }
    }

    document.getElementById("app").addEventListener("click", (event) => {
      if (event.target.closest("[data-go-auth]")) { ui.screen = "auth"; ui.authMode = "signup"; render(); return; }
      if (event.target.closest("[data-guest-continue]")) { openTab("home"); return; }
      const authMode = event.target.closest("[data-auth-mode]");
      if (authMode) { ui.authMode = authMode.getAttribute("data-auth-mode"); ui.error = ""; render(); return; }

      const setRole = event.target.closest("[data-set-role]");
      if (setRole) { ui.roleForm = setRole.getAttribute("data-set-role"); render(); return; }
      const setIntent = event.target.closest("[data-set-intent]");
      if (setIntent) { ui.intentForm = setIntent.getAttribute("data-set-intent"); render(); return; }

      const modalRole = event.target.closest("[data-modal-role]");
      if (modalRole) { ui.roleForm = modalRole.getAttribute("data-modal-role"); render(); return; }
      const modalIntent = event.target.closest("[data-modal-intent]");
      if (modalIntent) { ui.intentForm = modalIntent.getAttribute("data-modal-intent"); render(); return; }
      if (event.target.closest("[data-open-role-modal]")) {
        ui.editingRoleModal = true;
        ui.roleForm = currentRole();
        ui.specialtyForm = currentSpecialty();
        ui.intentForm = currentIntent();
        render();
        return;
      }
      if (event.target.closest("[data-close-role-modal]")) { ui.editingRoleModal = false; render(); return; }

      if (event.target.closest("[data-signout]")) {
        db.currentUser = null;
        save();
        ui.screen = "auth";
        ui.authMode = "signin";
        ui.notice = "Signed out.";
        render();
        return;
      }

      const tab = event.target.closest("[data-tab]");
      if (tab) { openTab(tab.getAttribute("data-tab")); return; }
      const cat = event.target.closest("[data-cat]");
      if (cat) { ui.category = cat.getAttribute("data-cat"); render(); return; }
      const homekind = event.target.closest("[data-homekind]");
      if (homekind) { ui.homeKind = homekind.getAttribute("data-homekind"); render(); return; }
      const q = event.target.closest("[data-q]");
      if (q) { push({ screen: "q", qid: Number(q.getAttribute("data-q")) }); return; }
      const kind = event.target.closest("[data-kind]");
      if (kind) { ui.kind = kind.getAttribute("data-kind"); render(); return; }
      const askcat = event.target.closest("[data-askcat]");
      if (askcat) { ui.askCategory = askcat.getAttribute("data-askcat"); render(); return; }
      const vote = event.target.closest("[data-vote]");
      if (vote) { onVote(Number(vote.getAttribute("data-vote"))); return; }
      const accept = event.target.closest("[data-accept]");
      if (accept) { onAccept(Number(accept.getAttribute("data-accept"))); return; }
      const del = event.target.closest("[data-delete]");
      if (del) { onDelete(del.getAttribute("data-delete")); return; }

      const startTopic = event.target.closest("[data-start-topic]");
      if (startTopic) { startConnectRoom(startTopic.getAttribute("data-start-topic")); return; }

      if (event.target.closest("[data-leave-connect]")) { ui.connectRoomId = null; openTab("connect"); return; }
      const wipeRoom = event.target.closest("[data-wipe-room]");
      if (wipeRoom) {
        const id = wipeRoom.getAttribute("data-wipe-room");
        db.connectRooms = (db.connectRooms || []).filter((r) => r.id !== id);
        save();
        ui.connectRoomId = null;
        ui.notice = "Chat wiped and destroyed.";
        openTab("connect");
        return;
      }

      const editQ = event.target.closest("[data-edit-q]");
      if (editQ) { ui.editingQuestion = true; ui.error = ""; render(); return; }
      if (event.target.closest("[data-cancel-edit-q]")) { ui.editingQuestion = false; ui.error = ""; render(); return; }

      const editA = event.target.closest("[data-edit-a]");
      if (editA) { ui.editingAnswerId = Number(editA.getAttribute("data-edit-a")); ui.error = ""; render(); return; }
      if (event.target.closest("[data-cancel-edit-a]")) { ui.editingAnswerId = null; ui.error = ""; render(); return; }

      const reportType = event.target.closest("[data-report-type]");
      if (reportType) {
        ui.reportModal = { type: reportType.getAttribute("data-report-type"), id: Number(reportType.getAttribute("data-report-id")) };
        render();
        return;
      }
      if (event.target.closest("[data-close-report]")) { ui.reportModal = null; render(); return; }

      const delThread = event.target.closest("[data-delete-thread]");
      if (delThread) {
        const id = Number(delThread.getAttribute("data-delete-thread"));
        db.threads = db.threads.filter((t) => t.id !== id);
        ui.threadId = null;
        ui.notice = "Thread deleted.";
        save();
        render();
        return;
      }

      const thread = event.target.closest("[data-thread]");
      if (thread) { ui.threadId = Number(thread.getAttribute("data-thread")); ui.error = ""; render(); return; }
      if (event.target.closest("[data-new-thread]")) { ui.threadId = null; ui.error = ""; render(); }
    });

    document.getElementById("app").addEventListener("input", (event) => {
      if (event.target.id === "search") {
        ui.query = event.target.value;
        render();
        return;
      }
      if (event.target.name === "name") ui.nameForm = event.target.value;
      if (event.target.name === "email") ui.emailForm = event.target.value;
      if (event.target.name === "password") ui.passwordForm = event.target.value;
      if (event.target.name === "specialty") ui.specialtyForm = event.target.value;
      if (event.target.name === "title" && event.target.form && event.target.form.id === "ask-form") ui.askTitle = event.target.value;
      if (event.target.name === "body" && event.target.form && event.target.form.id === "ask-form") ui.askBody = event.target.value;
    });

    document.getElementById("app").addEventListener("submit", (event) => {
      if (event.target.id === "signup-form") { event.preventDefault(); onSignUp(event.target); }
      if (event.target.id === "signin-form") { event.preventDefault(); onSignIn(event.target); }
      if (event.target.id === "update-role-form") { event.preventDefault(); onSaveRole(event.target); }
      if (event.target.id === "ask-form") { event.preventDefault(); onAsk(event.target); }
      if (event.target.id === "answer-form") { event.preventDefault(); onAnswer(event.target); }
      if (event.target.id === "edit-question-form") { event.preventDefault(); onSaveEditQuestion(event.target); }
      if (event.target.id === "edit-answer-form") { event.preventDefault(); onSaveEditAnswer(event.target); }
      if (event.target.id === "report-form") { event.preventDefault(); onSubmitReport(event.target); }
      if (event.target.id === "laya-form") { event.preventDefault(); onLaya(event.target); }
      if (event.target.id === "name-form") { event.preventDefault(); onName(event.target); }
      if (event.target.id === "custom-topic-form") {
        event.preventDefault();
        const topic = event.target.topic.value.trim();
        if (topic.length < 3) { ui.error = "Name the situation you want to talk about."; render(); return; }
        startConnectRoom(topic);
      }
      if (event.target.id === "connect-msg-form") {
        event.preventDefault();
        onSendConnectMsg(event.target);
      }
    });

    function onSignUp(form) {
      const name = form.name.value.trim();
      const email = form.email.value.trim().toLowerCase();
      const password = form.password.value;
      const specialty = form.specialty ? form.specialty.value.trim() : "";
      if (name.length < 2) { ui.error = "Add the name people should see."; render(); return; }
      if (!email.includes("@")) { ui.error = "Enter a valid email."; render(); return; }
      if (password.length < 6) { ui.error = "Password must be at least 6 characters."; render(); return; }
      if (ui.roleForm === "expert" && specialty.length < 2) { ui.error = "Please specify your field of expertise."; render(); return; }

      const existing = (db.accounts || []).find((a) => a.email === email);
      if (existing) { ui.error = "An account with that email already exists. Try signing in."; render(); return; }

      const user = {
        id: "usr_" + Date.now(),
        name: name,
        email: email,
        password: password,
        role: ui.roleForm,
        specialty: specialty,
        intent: ui.intentForm
      };
      db.accounts.push(user);
      db.currentUser = user;
      db.name = name;
      save();
      openTab("home");
    }

    function onSignIn(form) {
      const email = form.email.value.trim().toLowerCase();
      const password = form.password.value;
      const user = (db.accounts || []).find((a) => a.email === email && a.password === password);
      if (!user) {
        ui.error = "Those details didn't match our records.";
        render();
        return;
      }
      db.currentUser = user;
      db.name = user.name;
      save();
      openTab("home");
    }

    function onSaveRole(form) {
      if (!db.currentUser) {
        db.currentUser = { id: "me", name: displayName(), email: "", role: ui.roleForm, specialty: "", intent: ui.intentForm };
      }
      db.currentUser.role = ui.roleForm;
      db.currentUser.intent = ui.intentForm;
      if (ui.roleForm === "expert" && form.specialty) {
        db.currentUser.specialty = form.specialty.value.trim();
      } else {
        db.currentUser.specialty = "";
      }
      save();
      ui.editingRoleModal = false;
      ui.notice = "Profile role updated.";
      render();
    }

    function onSendConnectMsg(form) {
      const content = form.content.value.trim();
      const room = (db.connectRooms || []).find((r) => r.id === ui.connectRoomId);
      if (!room) return;
      if (content.length < 1) return;
      room.messages.push({ sender: room.myAlias, content: content });
      form.content.value = "";
      save();
      render();

      setTimeout(() => {
        const curRoom = (db.connectRooms || []).find((r) => r.id === ui.connectRoomId);
        if (!curRoom) return;
        const replies = [
          "I really hear you. That sounds exhausting to carry alone.",
          "I went through something very similar. What helped me was taking it one single day at a time.",
          "Thank you for sharing that. It takes courage to put it into words.",
          "I know exactly that feeling. You don't have to apologize for feeling this way."
        ];
        const reply = replies[Math.floor(Math.random() * replies.length)];
        curRoom.messages.push({ sender: curRoom.peerAlias, content: reply });
        save();
        if (ui.screen === "connect" && ui.connectRoomId === curRoom.id) render();
      }, 1200);
    }

    function onAsk(form) {
      const title = form.title.value.trim();
      const body = form.body.value.trim();
      ui.askTitle = form.title.value;
      ui.askBody = form.body.value;
      if (title.length < 8) { ui.error = "Give the question a title of at least 8 characters."; render(); return; }
      if (title.length > 140) { ui.error = "Keep the title under 140 characters."; render(); return; }
      if (body.length < 20) { ui.error = "Add a little more detail so people know how to answer."; render(); return; }
      if (!ui.askCategory) { ui.error = "Pick a category."; render(); return; }
      const id = db.nextId++;
      db.questions.push({
        id,
        userId: "me",
        authorName: displayName(),
        authorRole: currentRole(),
        authorSpecialty: currentSpecialty(),
        title,
        body,
        category: ui.askCategory,
        kind: ui.kind === "knowledge" ? "knowledge" : "experience",
        createdAt: new Date().toISOString()
      });
      bump("me", 1);
      ui.askTitle = "";
      ui.askBody = "";
      save();
      ui.stack = [{ screen: "home", qid: null, threadId: ui.threadId, connectRoomId: ui.connectRoomId }];
      ui.screen = "q";
      ui.qid = id;
      ui.error = "";
      render();
    }

    function onSaveEditQuestion(form) {
      const title = form.title.value.trim();
      const body = form.body.value.trim();
      const question = questionById(ui.qid);
      if (!question || question.userId !== "me") return;
      if (title.length < 8) { ui.error = "Title must be at least 8 characters."; render(); return; }
      if (body.length < 20) { ui.error = "Detail must be at least 20 characters."; render(); return; }
      question.title = title;
      question.body = body;
      question.editedAt = new Date().toISOString();
      save();
      ui.editingQuestion = false;
      ui.notice = "Question updated.";
      ui.error = "";
      render();
    }

    function onSaveEditAnswer(form) {
      const body = form.body.value.trim();
      const answer = db.answers.find((a) => a.id === ui.editingAnswerId);
      if (!answer || answer.userId !== "me") return;
      if (body.length < 10) { ui.error = "Answer must be at least 10 characters."; render(); return; }
      answer.body = body;
      answer.editedAt = new Date().toISOString();
      save();
      ui.editingAnswerId = null;
      ui.notice = "Answer updated.";
      ui.error = "";
      render();
    }

    function onSubmitReport(form) {
      const m = ui.reportModal;
      if (!m) return;
      const reason = form.reason.value;
      const details = form.details.value.trim();
      db.reports.push({
        id: db.nextId++,
        targetType: m.type,
        targetId: m.id,
        reason: reason,
        details: details,
        createdAt: new Date().toISOString()
      });
      save();
      ui.reportModal = null;
      ui.notice = "Report submitted. Thank you for keeping the community safe.";
      render();
    }

    function onAnswer(form) {
      const body = form.body.value.trim();
      const question = questionById(ui.qid);
      if (!question) return;
      if (body.length < 10) { ui.error = "Share a bit more than a few words."; render(); return; }
      if (body.length > 4000) { ui.error = "That answer is too long."; render(); return; }
      db.answers.push({
        id: db.nextId++,
        questionId: question.id,
        userId: "me",
        authorName: displayName(),
        authorRole: currentRole(),
        authorSpecialty: currentSpecialty(),
        body,
        helpful: 0,
        isBest: false,
        createdAt: new Date().toISOString()
      });
      bump("me", 2);
      save();
      ui.error = "";
      render();
    }

    function onVote(answerId) {
      const answer = db.answers.find((item) => item.id === answerId);
      if (!answer) return;
      if (answer.userId === "me") { ui.error = "You can't mark your own answer as helpful."; render(); return; }
      if (db.votes.includes(answerId)) { ui.error = "You already marked this helpful."; render(); return; }
      db.votes.push(answerId);
      answer.helpful += 1;
      bump(answer.userId, 1);
      save();
      ui.error = "";
      render();
    }

    function onAccept(answerId) {
      const answer = db.answers.find((item) => item.id === answerId);
      const question = questionById(ui.qid);
      if (!answer || !question) return;
      if (question.userId !== "me") { ui.error = "Only the person who asked can accept an answer."; render(); return; }
      if (answer.isBest) return;
      const previous = db.answers.filter((item) => item.questionId === question.id && item.isBest);
      previous.forEach((item) => {
        item.isBest = false;
        if (item.userId !== question.userId) bump(item.userId, -5);
      });
      answer.isBest = true;
      if (answer.userId !== question.userId) bump(answer.userId, 5);
      save();
      ui.error = "";
      render();
    }

    function onDelete(action) {
      if (action === "ask") { ui.confirmDelete = true; render(); return; }
      if (action === "no") { ui.confirmDelete = false; render(); return; }
      const question = questionById(ui.qid);
      if (!question || question.userId !== "me") { ui.error = "You can only delete your own question."; render(); return; }
      db.questions = db.questions.filter((item) => item.id !== question.id);
      db.answers = db.answers.filter((item) => item.questionId !== question.id);
      save();
      openTab("home");
    }

    function onLaya(form) {
      const prompt = form.prompt.value.trim();
      if (prompt.length < 2) { ui.error = "Ask Laya a real question."; render(); return; }
      if (prompt.length > 2000) { ui.error = "That question is too long."; render(); return; }
      let thread = db.threads.find((item) => item.id === ui.threadId);
      if (!thread) {
        thread = { id: db.nextId++, title: prompt.slice(0, 72), updatedAt: new Date().toISOString(), messages: [] };
        db.threads.push(thread);
        ui.threadId = thread.id;
      }
      thread.messages.push({ id: db.nextId++, role: "user", content: prompt });
      thread.messages.push({ id: db.nextId++, role: "assistant", content: layaReply(prompt) });
      thread.updatedAt = new Date().toISOString();
      save();
      ui.error = "";
      render();
    }

    function onName(form) {
      const name = form.name.value.replace(/[<>]/g, "").replace(/\s+/g, " ").trim().slice(0, 40);
      if (name.length < 2) { ui.error = "Use at least 2 letters so people know who you are."; ui.notice = ""; render(); return; }
      db.name = name;
      if (db.currentUser) db.currentUser.name = name;
      db.questions.forEach((question) => { if (question.userId === "me") question.authorName = name; });
      db.answers.forEach((answer) => { if (answer.userId === "me") answer.authorName = name; });
      save();
      ui.error = "";
      ui.notice = "Name saved.";
      render();
    }

    setInterval(() => {
      if (ui.screen === "connect" && ui.connectRoomId) {
        purgeExpiredRooms();
        render();
      }
    }, 1000);

    render();
    setTimeout(() => {
      if (ui.screen === "boot") {
        if (!db.currentUser) {
          ui.screen = "auth";
          ui.authMode = "signup";
        } else {
          openTab("home");
        }
        render();
      }
    }, 700);
  </script>
</body>
</html>
