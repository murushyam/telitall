name: Sync docs & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/assets/www/index.html'
      - 'TeliTall.apk'
      - 'docs/**'

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Sync index.html and APK to docs/
        run: |
          cp android/app/src/main/assets/www/index.html docs/index.html
          cp TeliTall.apk docs/TeliTall.apk
          echo "Files synced to docs/"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/TeliTall.apk
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-sync: update docs from source [skip ci]"
            git push
          fi
