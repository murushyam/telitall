name: Sync docs & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/assets/www/**'
      - 'TeliTall.apk'
      - 'docs/**'
      - 'vercel.json'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Sync index.html and APK to docs/
        run: |
          cp android/app/src/main/assets/www/index.html docs/index.html
          cp TeliTall.apk docs/TeliTall.apk
          echo "Files synced to docs/"

      - name: Commit docs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/TeliTall.apk
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-sync: update docs from source [skip ci]"
            git push
          fi

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          python scripts/deploy_to_vercel.py
